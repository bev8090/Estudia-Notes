# Runs on every push and pull request: typechecks, lints, tests and builds both apps.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # A throwaway Postgres for the API tests, so CI never touches the real Supabase database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CLIENT_URL: http://localhost:3000
      # Placeholders: the tests replace login and Claude with stand-ins, so no real keys are used.
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      ANTHROPIC_API_KEY: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies (also generates the Prisma client)
        run: npm ci

      # The migrations lock tables away from Supabase's built-in roles, which plain Postgres doesn't have.
      - name: Create Supabase roles
        run: psql "$DIRECT_URL" -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run

  client:
    name: Client (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Placeholders: the build doesn't call these services.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_API_URL: http://localhost:5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx next build
